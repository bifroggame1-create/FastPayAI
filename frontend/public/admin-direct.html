<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastPay Admin Direct</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { text-align: center; margin-bottom: 20px; color: #00d4aa; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { color: #00d4aa; margin-bottom: 15px; font-size: 18px; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #334;
      border-radius: 8px;
      background: #0f0f23;
      color: #fff;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00d4aa;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #00b894; }
    button:disabled { background: #666; cursor: not-allowed; }
    .list { margin-top: 15px; }
    .item {
      background: #0f0f23;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info { flex: 1; }
    .item-name { font-weight: bold; }
    .item-id { font-size: 12px; color: #888; }
    .delete-btn {
      background: #e74c3c;
      padding: 8px 16px;
      width: auto;
      font-size: 14px;
    }
    .status { padding: 10px; border-radius: 8px; margin-top: 10px; }
    .success { background: #00d4aa22; color: #00d4aa; }
    .error { background: #e74c3c22; color: #e74c3c; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      padding: 10px 20px;
      background: #16213e;
      border-radius: 20px;
      cursor: pointer;
      width: auto;
      font-size: 14px;
    }
    .tab.active { background: #00d4aa; color: #000; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>FastPay Admin v3.0</h1>

  <div class="tabs">
    <button class="tab active" onclick="showTab('admins')">Админы</button>
    <button class="tab" onclick="showTab('sellers')">Продавцы</button>
    <button class="tab" onclick="showTab('products')">Товары</button>
  </div>

  <!-- Admins Tab -->
  <div id="admins-tab" class="card">
    <h2>Добавить админа</h2>
    <input type="text" id="admin-input" placeholder="User ID или @username">
    <input type="text" id="admin-name" placeholder="Имя (опционально)">
    <button onclick="addAdmin()">+ Добавить админа</button>
    <div id="admin-status"></div>

    <h2 style="margin-top: 20px;">Список админов</h2>
    <button onclick="loadAdmins()" style="background: #334; margin-bottom: 10px;">Обновить</button>
    <div id="admins-list" class="list"></div>
  </div>

  <!-- Sellers Tab -->
  <div id="sellers-tab" class="card hidden">
    <h2>Добавить продавца</h2>
    <input type="text" id="seller-id" placeholder="ID продавца">
    <input type="text" id="seller-name" placeholder="Имя продавца">
    <input type="text" id="seller-avatar" placeholder="URL аватара (опционально)">
    <button onclick="addSeller()">+ Добавить продавца</button>
    <div id="seller-status"></div>

    <h2 style="margin-top: 20px;">Список продавцов</h2>
    <button onclick="loadSellers()" style="background: #334; margin-bottom: 10px;">Обновить</button>
    <div id="sellers-list" class="list"></div>
  </div>

  <!-- Products Tab -->
  <div id="products-tab" class="card hidden">
    <h2>Товары</h2>
    <button onclick="loadProducts()" style="background: #334; margin-bottom: 10px;">Загрузить товары</button>
    <div id="products-list" class="list"></div>
  </div>

  <script>
    const API_URL = 'https://fastpayai.onrender.com';
    const ADMIN_ID = '1301598469';

    function showTab(tab) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tab + '-tab').classList.remove('hidden');
      event.target.classList.add('active');
    }

    async function apiCall(method, endpoint, body = null) {
      const url = new URL(API_URL + endpoint);
      url.searchParams.set('admin_id', ADMIN_ID);

      const options = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Id': ADMIN_ID
        }
      };

      if (body) {
        body._adminId = ADMIN_ID;
        options.body = JSON.stringify(body);
      }

      const response = await fetch(url, options);
      return response.json();
    }

    async function loadAdmins() {
      const list = document.getElementById('admins-list');
      list.innerHTML = 'Загрузка...';
      try {
        const data = await apiCall('GET', '/admin/admins');
        if (data.success && data.admins) {
          list.innerHTML = data.admins.map(a => `
            <div class="item">
              <div class="item-info">
                <div class="item-name">${a.name || 'Без имени'}</div>
                <div class="item-id">ID: ${a.userId || a.id} ${a.username ? '• @' + a.username : ''}</div>
              </div>
              <button class="delete-btn" onclick="deleteAdmin('${a.id}')">Удалить</button>
            </div>
          `).join('') || '<p>Админов нет</p>';
        } else {
          list.innerHTML = '<p style="color:#e74c3c">Ошибка: ' + (data.error || 'Неизвестная ошибка') + '</p>';
        }
      } catch (e) {
        list.innerHTML = '<p style="color:#e74c3c">Ошибка сети: ' + e.message + '</p>';
      }
    }

    async function addAdmin() {
      const input = document.getElementById('admin-input').value.trim();
      const name = document.getElementById('admin-name').value.trim();
      const status = document.getElementById('admin-status');

      if (!input) {
        status.innerHTML = '<div class="status error">Введите User ID или @username</div>';
        return;
      }

      status.innerHTML = '<div class="status">Добавление...</div>';

      try {
        const isUsername = input.startsWith('@');
        const data = await apiCall('POST', '/admin/admins', {
          userId: isUsername ? undefined : input,
          username: isUsername ? input.substring(1) : undefined,
          name: name || undefined
        });

        if (data.success) {
          status.innerHTML = '<div class="status success">Админ добавлен!</div>';
          document.getElementById('admin-input').value = '';
          document.getElementById('admin-name').value = '';
          loadAdmins();
        } else {
          status.innerHTML = '<div class="status error">Ошибка: ' + (data.error || 'Неизвестная ошибка') + '</div>';
        }
      } catch (e) {
        status.innerHTML = '<div class="status error">Ошибка сети: ' + e.message + '</div>';
      }
    }

    async function deleteAdmin(id) {
      if (!confirm('Удалить админа?')) return;
      try {
        const data = await apiCall('DELETE', '/admin/admins/' + id);
        if (data.success) {
          loadAdmins();
        } else {
          alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
        }
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    async function loadSellers() {
      const list = document.getElementById('sellers-list');
      list.innerHTML = 'Загрузка...';
      try {
        const data = await apiCall('GET', '/admin/sellers');
        if (Array.isArray(data) || (data.sellers)) {
          const sellers = data.sellers || data;
          list.innerHTML = sellers.map(s => `
            <div class="item">
              <div class="item-info">
                <div class="item-name">${s.name}</div>
                <div class="item-id">ID: ${s.id} • Рейтинг: ${s.rating}</div>
              </div>
              <button class="delete-btn" onclick="deleteSeller('${s.id}')">Удалить</button>
            </div>
          `).join('') || '<p>Продавцов нет</p>';
        } else {
          list.innerHTML = '<p style="color:#e74c3c">Ошибка: ' + (data.error || 'Неизвестная ошибка') + '</p>';
        }
      } catch (e) {
        list.innerHTML = '<p style="color:#e74c3c">Ошибка сети: ' + e.message + '</p>';
      }
    }

    async function addSeller() {
      const id = document.getElementById('seller-id').value.trim();
      const name = document.getElementById('seller-name').value.trim();
      const avatar = document.getElementById('seller-avatar').value.trim();
      const status = document.getElementById('seller-status');

      if (!id || !name) {
        status.innerHTML = '<div class="status error">Введите ID и имя продавца</div>';
        return;
      }

      status.innerHTML = '<div class="status">Добавление...</div>';

      try {
        const data = await apiCall('POST', '/admin/sellers', {
          id,
          name,
          avatar: avatar || '/default-avatar.png',
          rating: 5.0,
          isVerified: false
        });

        if (data.success) {
          status.innerHTML = '<div class="status success">Продавец добавлен!</div>';
          document.getElementById('seller-id').value = '';
          document.getElementById('seller-name').value = '';
          document.getElementById('seller-avatar').value = '';
          loadSellers();
        } else {
          status.innerHTML = '<div class="status error">Ошибка: ' + (data.error || 'Неизвестная ошибка') + '</div>';
        }
      } catch (e) {
        status.innerHTML = '<div class="status error">Ошибка сети: ' + e.message + '</div>';
      }
    }

    async function deleteSeller(id) {
      if (!confirm('Удалить продавца?')) return;
      try {
        const data = await apiCall('DELETE', '/admin/sellers/' + id);
        if (data.success) {
          loadSellers();
        } else {
          alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
        }
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    async function loadProducts() {
      const list = document.getElementById('products-list');
      list.innerHTML = 'Загрузка...';
      try {
        const response = await fetch(API_URL + '/products');
        const products = await response.json();
        list.innerHTML = products.map(p => `
          <div class="item">
            <div class="item-info">
              <div class="item-name">${p.name}</div>
              <div class="item-id">${p.category} • ${p.price}₽</div>
            </div>
          </div>
        `).join('') || '<p>Товаров нет</p>';
      } catch (e) {
        list.innerHTML = '<p style="color:#e74c3c">Ошибка: ' + e.message + '</p>';
      }
    }

    // Load admins on page load
    loadAdmins();
  </script>
</body>
</html>
